name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match local development exactly.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated sources (drift) are not committed — see .gitignore.
      - name: Generate sources
        run: dart run build_runner build

      - name: Verify formatting
        # Only committed sources; generated files are not in the repo.
        run: git ls-files '*.dart' | xargs dart format --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # GitHub runners are UTC, which has no daylight saving. Date arithmetic
      # bugs that only appear in a DST timezone would pass unnoticed otherwise.
      - name: Test (DST timezone)
        run: flutter test
        env:
          TZ: America/New_York

      # analyze and test never compile the Android app, so a Gradle-level
      # failure — a plugin needing desugaring, a manifest clash, a minSdk
      # bump — passes CI and only shows up when someone runs the app.
      - name: Build Android APK
        run: flutter build apk --debug
