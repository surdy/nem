name: nem
description: "nem — a routine task tracker for recurring household and maintenance work."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  # RFC 5545 parsing and occurrence expansion for fixed schedules (ADR 0006).
  # UTC-only by design, which is why ADR 0010's relabelling dance exists.
  rrule: ^0.2.18
  # The IANA tz database. Resolves each expanded wall-clock occurrence to a real
  # instant (ADR 0010), and is what zonedSchedule needs for the digest.
  timezone: ^0.11.1
  # The daily digest.
  flutter_local_notifications: ^22.3.0
  # The only way to learn the device's IANA zone id; `timezone` ships the
  # database but cannot say which zone the device is in.
  flutter_timezone: ^5.1.0
  # Camera capture for QR labels and, later, product barcodes. Declares the
  # Android CAMERA permission itself; iOS needs NSCameraUsageDescription, which
  # is in Runner/Info.plist.
  mobile_scanner: ^7.4.1
  # Label rendering, and the PNG export behind "Export for printing".
  #
  # Chosen over `qr_flutter`, which PLAN.md's dependency table names: qr_flutter
  # last shipped in May 2023 and last saw a commit in May 2024, and label
  # rendering sits on the critical path of the whole scanning feature. Both wrap
  # the same `qr` package, so the encoder is identical either way and the choice
  # is only about which wrapper is still maintained.
  pretty_qr_code: ^3.6.0
  # The system share sheet, which is where printing, AirDrop and "save to Files"
  # all live — a label is useless until it is off the phone and on paper.
  share_plus: ^13.3.0
  # Reading and writing NFC tags on both platforms. It declares no Android
  # permissions of its own, so AndroidManifest.xml declares NFC itself, and it
  # reads no launch intent at all — which is why Android tap-to-launch from a
  # closed app is #9 and not part of #8.
  #
  # 4.x, and none of the 3.x examples compile against it: `isAvailable` became
  # `checkAvailability`, `startSession` now requires `pollingOptions`, `onError`
  # became `onSessionErrorIos`, and NDEF moved out into its own package.
  nfc_manager: ^4.2.1
  # NDEF, which 4.0 deleted from nfc_manager. There is no URI record helper in
  # either package — `NdefRecord.createUri` did not survive the move — so
  # `lib/src/nfc/ndef_uri.dart` assembles the record by hand.
  nfc_manager_ndef: ^1.1.0

  # Auth, Postgres and realtime against Supabase (ADR 0002 — spoken to
  # directly, with no gateway layer in between).
  #
  # 2.x, not the 3.0.0-dev prereleases: 2.17.2 is the current stable. Note
  # `Supabase.initialize` now takes `publishableKey` alongside `anonKey`; nem
  # passes `anonKey`, which is what a self-hosted instance still issues.
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
