name: nem
description: "nem — a routine task tracker for recurring household and maintenance work."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  # RFC 5545 parsing and occurrence expansion for fixed schedules (ADR 0006).
  # UTC-only by design, which is why ADR 0010's relabelling dance exists.
  rrule: ^0.2.18
  # The IANA tz database. Resolves each expanded wall-clock occurrence to a real
  # instant (ADR 0010), and is what zonedSchedule needs for the digest.
  timezone: ^0.11.1
  # The daily digest.
  flutter_local_notifications: ^22.3.0
  # The only way to learn the device's IANA zone id; `timezone` ships the
  # database but cannot say which zone the device is in.
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
